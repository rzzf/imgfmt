name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  test:
    if: github.repository == 'rzzf/imgfmt'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version: "24"
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Check
        run: vp check

      - name: Test
        run: vp test

      - name: Build
        run: vp run build

  publish:
    if: github.repository == 'rzzf/imgfmt'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/imgfmt
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version: "24"
          cache: false
          run-install: false

      - name: Use an OIDC-capable npm CLI
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@11.6.1

      - name: Verify release target
        id: release
        shell: bash
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          test "$(git rev-list -n 1 "$TAG_NAME")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
          echo "git_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and publish
        run: sh ./scripts/publish.sh
        env:
          FORCE_COLOR: 2
          GIT_HEAD: ${{ steps.release.outputs.git_head }}
          NODE_OPTIONS: --max-old-space-size=4096
          NPM_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          TAG_VERSION: ${{ github.event.release.tag_name }}
